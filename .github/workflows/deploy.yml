name: Deploy to GitHub Pages

on:
  # Cada push a main republica la web
  push:
    branches: [main]
  # ...y permite lanzarlo a mano desde la pestana Actions
  workflow_dispatch:

# Permisos que necesita actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez, sin cancelar el que ya esta en curso
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # Los telefonos y el IBAN son secretos del entorno github-pages, no del
    # repositorio. El job tiene que declarar el entorno para poder leerlos; sin
    # esto llegan vacios y el build aborta al renderizar CONTACTO o la FAQ.
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Ni los telefonos ni el numero de cuenta estan en el repositorio: se
      # escriben aqui desde los secretos para que Astro los lea igual que el
      # .env local. El fichero solo existe dentro del runner, que se destruye
      # al terminar el job.
      - name: Write .env from secrets
        run: |
          {
            echo "TEL_LUCIA=${{ secrets.TEL_LUCIA }}"
            echo "TEL_MANUEL=${{ secrets.TEL_MANUEL }}"
            echo "IBAN=${{ secrets.IBAN }}"
          } > .env

      - name: Install, build and upload site
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
